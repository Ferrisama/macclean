name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - run: |
          mkdir -p dist/macclean-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/macclean dist/macclean-${{ github.ref_name }}-${{ matrix.target }}/macclean
          cp README.md LICENSE dist/macclean-${{ github.ref_name }}-${{ matrix.target }}/
          tar -C dist -czf dist/macclean-${{ github.ref_name }}-${{ matrix.target }}.tar.gz macclean-${{ github.ref_name }}-${{ matrix.target }}
          shasum -a 256 dist/macclean-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > dist/macclean-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macclean-${{ matrix.target }}
          path: |
            dist/macclean-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/macclean-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
