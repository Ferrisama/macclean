[package]
name = "macclean"
version = "0.3.0"
edition = "2021"
authors = ["Ferrisama"]
description = "Mac system maintenance CLI -- clean, analyze, secure, monitor"
license = "MIT"
repository = "https://github.com/Ferrisama/macclean"

[[bin]]
name = "macclean"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
indicatif = "0.17"
comfy-table = "7"
colored = "2"
walkdir = "2"
rayon = "1"
sha2 = "0.10"
digest = "0.10"
anyhow = "1"
dirs = "5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
plist = "1"
ratatui = "0.29"
crossterm = "0.28"
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
